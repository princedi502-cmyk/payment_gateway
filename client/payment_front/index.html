<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PaymentHub - Your trusted destination for quality products with secure, seamless payments powered by Stripe." />
    <meta name="keywords" content="ecommerce, payment, stripe, shopping, online store, react" />
    <meta name="author" content="PaymentHub" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://paymenthub.com/" />
    <meta property="og:title" content="PaymentHub - Seamless Payments, Beautiful Experience" />
    <meta property="og:description" content="Your trusted destination for quality products with secure, seamless payments powered by Stripe." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="PaymentHub" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://paymenthub.com/" />
    <meta name="twitter:title" content="PaymentHub - Seamless Payments, Beautiful Experience" />
    <meta name="twitter:description" content="Your trusted destination for quality products with secure, seamless payments powered by Stripe." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#6366f1" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <title>PaymentHub - Seamless Payments, Beautiful Experience</title>

    <!-- OneSignal -->
    <script
      src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
      defer
    ></script>

    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];

      OneSignalDeferred.push(async function (OneSignal) {
        await OneSignal.init({
          appId: "a2148b6b-5ab6-443d-8e7c-ab5a73f30c4c",
          notifyButton: {
            enable: true,
          },
          allowLocalhostAsSecureOrigin: true,
          promptOptions: {
            ...OneSignal.defaultPromptOptions,
          },
        });
      });
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
